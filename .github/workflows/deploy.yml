# Builds the static site and publishes it to GitHub Pages.
#
# - Push to main          → validate, build and deploy.
# - Pull request to main  → validate and build only (nothing is published).
# - Manual run (Actions tab → "Deploy to GitHub Pages" → Run workflow) → deploys when run on main.
#
# One-time setup in the repository settings: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Optional repository variables (Settings → Secrets and
# variables → Actions → Variables): FORM_ENDPOINT, ALLOW_INDEXING. See README.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Provides the published origin and base path (e.g. "/lili_web", or "" with a custom domain).
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          SITE_URL: ${{ steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
          # Public values (visible in the page HTML) — configured as repository variables, not secrets.
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          PUBLIC_ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/bg/index.html
          test -f dist/en/index.html
          test -f dist/sitemap-index.xml
          echo "Pages built: $(find dist -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
